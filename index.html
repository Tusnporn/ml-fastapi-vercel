<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินและวิเคราะห์อัจฉริยะ (Pink AI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fdf2f8;
            color: #374151;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(219, 39, 119, 0.15);
        }
        .header {
            background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #fbcfe8;
            background: #fdf2f8;
            color: #be185d;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #db2777;
            color: white;
            border-color: #db2777;
        }
        .card { display: none; }
        .card.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #831843; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #f9a8d4;
            border-radius: 8px;
            font-family: 'Prompt', sans-serif;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #db2777 0%, #ec4899 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            text-align: center;
        }
        .result-success { background: #fce7f3; border: 2px solid #f472b6; color: #831843; }
        .result-error { background: #fee2e2; border: 2px solid #ef4444; color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌸 ระบบประเมินและวิเคราะห์อัจฉริยะ</h1>
        <p>Insurance Cost & HR Attrition Prediction (FastAPI + Decision Tree)</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('insurance', event)">💰 ทำนายเบี้ยประกัน</button>
        <button class="tab-btn" onclick="switchTab('hr', event)">👔 ประเมินพนักงานลาออก</button>
    </div>

    <!-- ส่วนที่ 1: ทำนายเบี้ยประกัน -->
    <div id="insurance" class="card active">
        <div class="form-group">
            <label>อายุผู้เอาประกัน (ปี)</label>
            <input type="number" id="age" value="35" placeholder="เช่น 35">
        </div>
        <div class="form-group">
            <label>ดัชนีมวลกาย (BMI)</label>
            <input type="number" step="0.1" id="bmi" value="28.5" placeholder="เช่น 28.5">
        </div>
        <div class="form-group">
            <label>จำนวนบุตร (คน)</label>
            <input type="number" id="children" value="1" placeholder="เช่น 1">
        </div>
        <div class="form-group">
            <label>ประวัติการสูบบุหรี่</label>
            <select id="smoker">
                <option value="">-- กรุณาเลือก --</option>
                <option value="0" selected>ไม่สูบ (No)</option>
                <option value="1">สูบ (Yes)</option>
            </select>
        </div>
        <button id="btn-ins" class="submit-btn" onclick="predictInsurance()">คำนวณเบี้ยประกัน</button>
        <div id="res-insurance" class="result-box"></div>
    </div>

    <!-- ส่วนที่ 2: ประเมินพนักงานลาออก -->
    <div id="hr" class="card">
        <div class="form-group">
            <label>อายุพนักงานปัจจุบัน (ปี)</label>
            <input type="number" id="emp_age" value="30" placeholder="เช่น 30">
        </div>
        <div class="form-group">
            <label>เงินเดือน (ดอลลาร์ / เดือน)</label>
            <input type="number" id="income" value="4000" placeholder="เช่น 4000">
        </div>
        <div class="form-group">
            <label>ระยะทางจากบ้าน (ไมล์)</label>
            <input type="number" id="distance" value="20" placeholder="เช่น 20">
        </div>
        <div class="form-group">
            <label>การทำล่วงเวลา (OverTime)</label>
            <select id="overtime">
                <option value="">-- กรุณาเลือก --</option>
                <option value="0" selected>ไม่มี (No)</option>
                <option value="1">มี (Yes)</option>
            </select>
        </div>
        <button id="btn-hr" class="submit-btn" onclick="predictHR()">วิเคราะห์ความเสี่ยง</button>
        <div id="res-hr" class="result-box"></div>
    </div>
</div>

<script>
    const API_URL = "https://ml-fastapi-vercel.vercel.app";

    function switchTab(tabId, e) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        e.target.classList.add('active');
    }

    async function predictInsurance() {
        const age = document.getElementById('age').value;
        const bmi = document.getElementById('bmi').value;
        const children = document.getElementById('children').value;
        const smoker = document.getElementById('smoker').value;
        const resBox = document.getElementById('res-insurance');
        const btn = document.getElementById('btn-ins');

        if (age === "" || bmi === "" || children === "" || smoker === "") {
            resBox.style.display = "block";
            resBox.className = "result-box result-error";
            resBox.innerHTML = "⚠️ กรุณากรอกข้อมูลให้ครบทุกช่องก่อนกดทำนายค่ะ";
            return;
        }

        btn.disabled = true;
        btn.innerText = "กำลังทำนาย... (ครั้งแรกอาจใช้เวลาสักครู่)";

        try {
            const response = await fetch(`${API_URL}/predict`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model_type: "insurance",
                    age: parseInt(age),
                    bmi: parseFloat(bmi),
                    children: parseInt(children),
                    smoker: parseInt(smoker)
                })
            });
            const data = await response.json();
            resBox.style.display = "block";
            resBox.className = "result-box result-success";
            resBox.innerHTML = `<h3>💰 ค่าเบี้ยประกันที่คาดการณ์: $${data.prediction.toLocaleString()} / ปี</h3>`;
        } catch (err) {
            resBox.style.display = "block";
            resBox.className = "result-box result-error";
            resBox.innerHTML = "❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งค่ะ";
        } finally {
            btn.disabled = false;
            btn.innerText = "คำนวณเบี้ยประกัน";
        }
    }

    async function predictHR() {
        const emp_age = document.getElementById('emp_age').value;
        const income = document.getElementById('income').value;
        const distance = document.getElementById('distance').value;
        const overtime = document.getElementById('overtime').value;
        const resBox = document.getElementById('res-hr');
        const btn = document.getElementById('btn-hr');

        if (emp_age === "" || income === "" || distance === "" || overtime === "") {
            resBox.style.display = "block";
            resBox.className = "result-box result-error";
            resBox.innerHTML = "⚠️ กรุณากรอกข้อมูลพนักงานให้ครบทุกช่องก่อนกดวิเคราะห์ค่ะ";
            return;
        }

        btn.disabled = true;
        btn.innerText = "กำลังวิเคราะห์... (ครั้งแรกอาจใช้เวลาสักครู่)";

        try {
            const response = await fetch(`${API_URL}/predict`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model_type: "hr",
                    Age: parseInt(emp_age),
                    MonthlyIncome: parseFloat(income),
                    DistanceFromHome: parseInt(distance),
                    OverTime: parseInt(overtime)
                })
            });
            const data = await response.json();
            resBox.style.display = "block";
            resBox.className = data.prediction === 1 ? "result-box result-error" : "result-box result-success";
            resBox.innerHTML = `<h3>ผลการประเมิน: ${data.label}</h3>`;
        } catch (err) {
            resBox.style.display = "block";
            resBox.className = "result-box result-error";
            resBox.innerHTML = "❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้งค่ะ";
        } finally {
            btn.disabled = false;
            btn.innerText = "วิเคราะห์ความเสี่ยง";
        }
    }
</script>

</body>
</html>
